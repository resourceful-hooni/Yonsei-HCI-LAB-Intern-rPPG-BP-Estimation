name: Weekly Browserslist DB Update

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  update-browserslist-db:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Update Browserslist DB
        run: npx update-browserslist-db@latest --yes

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(frontend): update browserslist database"
          title: "chore(frontend): update browserslist database"
          body: |
            Automated weekly update of Browserslist database (`caniuse-lite`).
          branch: "chore/browserslist-db-update"
          delete-branch: true
          labels: |
            dependencies
            frontend
          add-paths: |
            frontend/package-lock.json
            frontend/package.json

      # GITHUB_TOKEN으로 만든 PR은 pull_request CI를 트리거하지 않으므로 직접 실행해서 필수 체크를 채움
      - name: Run CI and enable auto-merge
        if: steps.cpr.outputs.pull-request-number
        run: |
          gh workflow run ci-maintenance.yml --ref chore/browserslist-db-update
          gh pr merge --auto --squash "${{ steps.cpr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
